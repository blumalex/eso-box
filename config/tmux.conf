
# eso-box: tab titles
# The terminal tab shows "◐ <Claude's title> · <session>": ◐/◑ alternate while Claude works,
# ✳ when it's done or waiting on you, 💤 once the turn ended 5 min ago. Claude Code animates its
# own title only outside tmux, so tmux draws it here. "Working" = the @claude_busy flag (set by
# eso-box's hooks) AND output in the last 3 s; the output check is what turns the tab back to ✳
# after an Esc, which skips the Stop hook. The 5 min count from @claude_done, which the Stop hook
# stamps (a pane's last output can come minutes after the turn ends); an Esc'd turn, or a session
# with no stamp yet, counts from the last output instead.
set -g set-titles on
set -g status-interval 1
set -g set-titles-string "#{?#{&&:#{@claude_busy},#{e|<:#{e|-:%s,#{window_activity}},3}},#{?#{m:*[02468],%S},◐,◑},#{?#{e|<:#{e|-:%s,#{?#{@claude_busy},#{window_activity},#{?#{@claude_done},#{@claude_done},#{window_activity}}}},300},✳,💤}} #{s/^✳ //:pane_title} · #S"
