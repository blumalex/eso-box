
# eso-box: tab titles
# The terminal tab shows "◐ <Claude's title> · <session>": ◐/◑ alternate while Claude works,
# ✳ when it's done or waiting on you. Claude Code animates its own title only outside tmux, so
# tmux draws it here. "Working" = the @claude_busy flag (set by eso-box's hooks) AND output in
# the last 3 s; the output check is what turns the tab back to ✳ after an Esc, which skips the
# Stop hook.
set -g set-titles on
set -g status-interval 1
set -g set-titles-string "#{?#{&&:#{@claude_busy},#{e|<:#{e|-:%s,#{window_activity}},3}},#{?#{m:*[02468],%S},◐,◑},✳} #{s/^✳ //:pane_title} · #S"
